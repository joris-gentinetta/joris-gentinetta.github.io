<!-- Basic Page Needs
================================================== -->
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.title }}">
<meta name="keywords" content="">

<!-- Mobile Specific Metas
================================================== -->
<meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,300i,400,600,700" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css">

<!-- Favicon
================================================== -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/photos/favicon/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/photos/favicon/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/photos/favicon/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/photos/favicon/site.webmanifest' | relative_url }}">

<!-- Stylesheets
================================================== -->
<!-- Bootstrap core CSS -->
<link href="{{ '/assets/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">

<!-- Custom styles for this template -->
<link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
<link href="{{ '/assets/css/responsive.css' | relative_url }}" rel="stylesheet">

<!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
<!--[if lt IE 9]>
<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
<![endif]-->
